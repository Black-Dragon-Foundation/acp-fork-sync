# Daily: carry drgnx's patch onto each fork's newest upstream release, check it, release it with its package.
# The logic is sync.sh; each fork's settings are forks/<fork>.env. DeepSeek is synced by hand (README).
name: sync

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: acp-fork-sync
  cancel-in-progress: false

jobs:
  # Runs upstream's code (install scripts, tests, builds): no secrets, a read-only token, no stored credentials.
  check:
    strategy:
      fail-fast: false
      matrix:
        fork: [claude-agent-acp, gemini-cli, kimi-code]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: settings
        run: bash sync.sh settings "$FORK" >> "$GITHUB_OUTPUT"
        env:
          FORK: ${{ matrix.fork }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.settings.outputs.node_version }}
      - run: bash sync.sh prepare "$FORK"
        env:
          FORK: ${{ matrix.fork }}
          DRGNX_SYNC_OUT: ${{ runner.temp }}/drgnx-sync
          DRGNX_SYNC_WORK: ${{ runner.temp }}/drgnx-fork
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-${{ matrix.fork }}
          path: ${{ runner.temp }}/drgnx-sync
          if-no-files-found: error
          retention-days: 7

  # Runs only this repo's sync.sh: plans again, matches the checked outcome, then pushes and releases with a
  # short-lived GitHub App token scoped to the one fork.
  publish:
    needs: check
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        fork: [claude-agent-acp, gemini-cli, kimi-code]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sync-${{ matrix.fork }}
          path: ${{ runner.temp }}/drgnx-sync
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.DRGNX_SYNC_APP_ID }}
          private-key: ${{ secrets.DRGNX_SYNC_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.fork }}
          permission-contents: write
          permission-workflows: write
          permission-issues: write
      - run: bash sync.sh publish "$FORK"
        env:
          FORK: ${{ matrix.fork }}
          DRGNX_SYNC_OUT: ${{ runner.temp }}/drgnx-sync
          DRGNX_SYNC_WORK: ${{ runner.temp }}/drgnx-fork
          GH_TOKEN: ${{ steps.token.outputs.token }}

  # GitHub turns off a public repo's schedules after 60 days without activity: an empty commit once it is quiet.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash sync.sh keepalive
